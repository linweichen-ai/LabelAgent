# @package _global_
defaults:
  - /roboflow_v100/roboflow_v100_full_ft_100_images
  - _self_

paths:
  roboflow_vl_100_root: ${oc.env:SAM3_STAGE0_DATA_ROOT}
  stage0_train_root: ${oc.env:SAM3_STAGE0_TRAIN_ROOT}
  stage0_val_root: ${oc.env:SAM3_STAGE0_VAL_ROOT}
  experiment_log_dir: ${oc.env:SAM3_STAGE0_OUTPUT_ROOT}
  bpe_path: ${oc.env:SAM3_STAGE0_BPE_PATH}

roboflow_train:
  num_images: 72
  supercategory: .
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict: {loss_bbox: 5.0, loss_giou: 2.0}
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: false
        weight_dict: {loss_ce: 20.0, presence_loss: 20.0}
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: true
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict: {loss_mask: 200.0, loss_dice: 10.0}
        compute_aux: false
    loss_fn_semantic_seg: null
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

scratch:
  enable_segmentation: true
  num_train_workers: 8
  num_val_workers: 4
  max_data_epochs: 20
  train_batch_size: 1
  val_batch_size: 1
  gradient_accumulation_steps: 1
  lr_transformer: 1.0e-4
  wd: 0.01

trainer:
  _target_: sam3.train.stage0_trainer.Stage0MaskEmbedTrainer
  skip_saving_ckpts: false
  skip_first_val: false
  max_epochs: 20
  seed_value: 3407
  val_epoch_freq: 1
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}
  distributed:
    backend: nccl
    find_unused_parameters: true
    gradient_as_bucket_view: true
  data:
    train:
      dataset:
        img_folder: ${paths.stage0_train_root}
        ann_file: ${paths.stage0_train_root}/_annotations.coco.json
    val:
      dataset:
        img_folder: ${paths.stage0_val_root}
        ann_file: ${paths.stage0_val_root}/_annotations.coco.json
  model:
    _target_: sam3.train.stage0_scope.build_stage0_image_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: false
    checkpoint_path: ${oc.env:SAM3_STAGE0_CHECKPOINT}
    checkpoint_sha256: 9999e2341ceef5e136daa386eecb55cb414446a00ac2b55eb2dfd2f7c3cf8c9e
    load_from_HF: false
    enable_segmentation: true
    enable_inst_interactivity: false
    compile: false
  optim:
    amp: {enabled: true, amp_dtype: bfloat16}
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    param_group_modifiers: null
    options:
      lr:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 1.0e-4
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.01
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1
    save_list: [1, 5, 10, 15, 20]
    resume_from: null

launcher:
  num_nodes: 1
  gpus_per_node: 2
  experiment_log_dir: ${paths.experiment_log_dir}

submitit:
  use_cluster: false
  job_array: {num_tasks: 0, task_index: 0}
