<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LabelAgent · 训练样本人工审核</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#183343;font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1460px;margin:auto;padding:24px}h1{font-size:25px;margin:0}.toolbar,.panel{background:white;border:1px solid #dae3e8;border-radius:12px;padding:18px;margin:14px 0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input{padding:9px;border:1px solid #b7c8d2;border-radius:6px}button{cursor:pointer;padding:11px 16px;background:#087d73;color:white;border:0;border-radius:7px;font:inherit}button.secondary{background:#e8eef1;color:#183343}button.danger{background:#ad4b3c}.views{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.views img{width:100%;height:550px;object-fit:contain;background:#16252c;border-radius:9px}.muted{color:#627783}#message{min-height:28px;color:#995113}.actions{display:flex;gap:10px;flex-wrap:wrap}code{background:#e6eef2;padding:3px 8px}@media(max-width:900px){.views{grid-template-columns:1fr}.views img{height:380px}}</style>
<main><h1>LabelAgent · 训练样本人工审核</h1><p class="muted">60个真实模型候选，来自既有20张调参图。仅审核黄色轮廓的类别；这不会把候选轮廓变成人工分割真值。</p>
<div class="toolbar"><label>审核人 <input id="reviewer" placeholder="填写姓名或工作代号"></label><button id="previous" class="secondary">上一例</button><button id="next" class="secondary">下一例</button><strong id="progress"></strong><button id="download">下载已审核JSONL</button><label>恢复审核文件 <input id="upload" type="file" accept=".jsonl,.txt"></label></div>
<div class="panel"><strong id="case"></strong><p id="details" class="muted"></p><div class="views"><figure><figcaption>完整场景 · 黄色线对应当前候选</figcaption><img id="scene" alt="候选所在场景"></figure><figure><figcaption>局部图 · 查看类别与遮挡</figcaption><img id="crop" alt="候选局部图"></figure></div></div>
<div class="panel"><p>托盘指货物托盘；叉车货叉、托盘车车体、背景和反光不能仅因形似就归为托盘。边界明显错误也请在备注说明，留给SAM3分割诊断。</p><div class="actions"><button data-decision="keep">1 · 保留原类别</button><button class="danger" data-decision="reject">2 · 错误候选／拒绝</button><button data-decision="person">3 · 改为人员</button><button data-decision="pallet">4 · 改为托盘</button><button class="secondary" data-decision="uncertain">5 · 看不清／不确定</button></div><p><label>备注 <input id="notes" style="width:min(100%,800px)" placeholder="例如：轮廓粘连、叉车部件、目标太小"></label></p><p id="message"></p></div>
<p class="muted">点击审核按钮会记录审核人和时间，并跳到下一例。请下载JSONL保存成果；浏览器存储仅用于本机临时恢复。不会修改原始标注或工作台。</p></main>
<script>
const original=__RECORDS_JSON__;
const storageKey='labelagent-pai-review-__QUEUE_DIGEST__';let rows=structuredClone(original),index=0;
const el=id=>document.getElementById(id),message=t=>el('message').textContent=t;
function restore(items){for(const r of items){const j=rows.findIndex(x=>x.sample_id===r.sample_id);if(j<0)throw Error('审核文件包含其他队列的样例');if(r.review_status==='human_reviewed'){for(const k of ['review_status','reviewer','reviewed_at','decision','correct_label','notes'])rows[j][k]=r[k]}}}
try{const cached=JSON.parse(localStorage.getItem(storageKey)||'null');if(cached){restore(cached.rows);el('reviewer').value=cached.reviewer||''}}catch(e){message('本机缓存未恢复：'+e.message)}
function show(){const r=rows[index];el('case').textContent=`${index+1}/${rows.length} · ${r.sample_id} · 原候选类别 ${r.proposed_label}`;el('details').textContent=`帧 ${r.frame} · ${r.camera} · ${r.review_status==='human_reviewed'?'已审核：'+r.decision+' / '+r.correct_label:'待审核'} · 分组 ${r.group_id}`;el('scene').src=r.images[0];el('crop').src=r.images[1];el('notes').value=r.review_status==='human_reviewed'?(r.notes||''):'';el('progress').textContent=`已审核 ${rows.filter(x=>x.review_status==='human_reviewed').length}/${rows.length}`}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({rows,reviewer:el('reviewer').value}))}catch(e){message('浏览器未保存缓存，请下载JSONL。')}}
function decide(kind){const reviewer=el('reviewer').value.trim();if(!reviewer){message('请先填写审核人。');el('reviewer').focus();return}const r=rows[index];let decision=kind,label=kind==='reject'?'other':kind==='uncertain'?'unknown':r.proposed_label;if(kind==='person'||kind==='pallet'){label=kind;decision=kind===r.proposed_label?'keep':'relabel'}Object.assign(r,{review_status:'human_reviewed',reviewer,reviewed_at:new Date().toISOString(),decision,correct_label:label,notes:el('notes').value});save();message('已记录。');if(index<rows.length-1)index++;show()}
document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>decide(b.dataset.decision));el('previous').onclick=()=>{index=Math.max(0,index-1);show()};el('next').onclick=()=>{index=Math.min(rows.length-1,index+1);show()};
el('download').onclick=()=>{const done=rows.filter(r=>r.review_status==='human_reviewed');if(!done.length){message('尚无已审核样例。');return}const a=document.createElement('a');const url=URL.createObjectURL(new Blob([done.map(r=>JSON.stringify(r)).join('\n')+'\n'],{type:'application/x-ndjson'}));a.href=url;a.download='reviewed.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('upload').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const a=(await file.text()).split(/\r?\n/).filter(x=>x.trim()).map(JSON.parse);restore(a);save();show();message('已恢复审核记录。')}catch(e){message('导入失败：'+e.message)}};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;const kinds={'1':'keep','2':'reject','3':'person','4':'pallet','5':'uncertain'};if(kinds[e.key])decide(kinds[e.key]);if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('previous').click()});show();
</script></html>
